replicaCount: 1
image:
  repository: acrchistdev.azurecr.io/chist-frontend-next
  pullPolicy: Always
  tag: 'eeb8e93'
containerPort: 3000
env:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  AUTH_COOKIE_SECURE: "false"
  NEXT_PUBLIC_DEFAULT_LOCALE: "bg"
  # Per-module backend bases (in-cluster ClusterIP DNS, include /api).
  # serverFetch routes by path prefix; BACKEND_URL is the fallback.
  USER_API_URL: "http://user-module:8080/api"
  REPORT_API_URL: "http://report-module:8081/api"
  NOTIFICATION_API_URL: "http://notification-module:8082/api"
  VERIFICATION_API_URL: "http://verification-module:8083/api"
  BACKEND_URL: "http://user-module:8080/api"
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: "20.240.6.13.nip.io"
      paths:
        - path: /
          pathType: Prefix
          servicePort: 80
  tls: []
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 5
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
httpRoute:
  enabled: false
