replicaCount: 1

image:
  repository: acrchistdev.azurecr.io/chist-frontend
  pullPolicy: Always
  tag: '8dffc58'


env:
  - name: VITE_API_URL
    value: "http://user-module:8080"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80

# 2. Поправка на структурата на ingress пътя спрямо съвременните Helm изисквания
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: "20.240.6.13.nip.io"
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend-frontend-chart
              port:
                number: 80
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 15
  threshold: 1 # променено на валидно за k8s поле (вместо failureThreshold повторено)

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

httpRoute:
  enabled: false
